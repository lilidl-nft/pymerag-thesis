[project]
name = "pymerag"
version = "0.1.0"
description = "RAG-MCP Assistant — Asistente Inteligente para Gestión Documental"
requires-python = ">=3.12"
dependencies = [
    # ── API Server ────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # ── Database ──────────────────────────────────────────────
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.14",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",

    # ── HTTP Client ───────────────────────────────────────────
    "httpx>=0.27",

    # ── Vector Database ───────────────────────────────────────
    "qdrant-client>=1.9",

    # ── Document Extraction ───────────────────────────────────
    "docling>=2.0",

    # ── Embeddings ────────────────────────────────────────────
    "numpy>=1.26",
    "FlagEmbedding>=1.2",

    # ── Language Detection ────────────────────────────────────
    "langdetect>=1.0",

    # ── Agent Orchestration ───────────────────────────────────
    "langgraph>=0.2",

    # ── MCP Server ────────────────────────────────────────────
    "fastmcp>=2.0",
]

[project.optional-dependencies]
# Observability
observability = [
    "python-json-logger>=2.0",
]

# Topic modeling — BERTopic pipeline
topics = [
    "bertopic>=0.16",
    "scikit-learn>=1.4",
]

# Development and testing
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

# Frontend — Streamlit UI
frontend = [
    "streamlit>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
pymerag-api = "app.main:app"

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
